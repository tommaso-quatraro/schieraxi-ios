name: Compila IPA

# Compila l'app su un Mac di GitHub SENZA firma (la firma la fa SideStore sull'iPhone con l'Apple ID gratuito).
# L'indirizzo dell'app non sta nel codice: variabili del repository FANTA_HOST e FANTA_PORT (Settings > Secrets and variables > Actions > Variables).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Immagine del Mac (prova: macos-26 per Xcode 26 e Liquid Glass; la release si crea solo con quella predefinita)"
        type: choice
        options: [macos-15, macos-26]
        default: macos-15
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installa XcodeGen
        run: brew install xcodegen
      - name: Crea il progetto Xcode
        run: xcodegen generate
      - name: Compila (senza firma)
        env:
          FANTA_HOST: ${{ vars.FANTA_HOST }}
          FANTA_PORT: ${{ vars.FANTA_PORT }}
        run: |
          set -o pipefail
          xcodebuild -project Schieraxi.xcodeproj -scheme Schieraxi -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Schieraxi.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            FANTA_HOST="$FANTA_HOST" FANTA_PORT="$FANTA_PORT" 2>&1 | tee build.log | tail -n 40
      - name: Crea l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Schieraxi.xcarchive/Products/Applications/Schieraxi.app Payload/
          zip -qry Schieraxi.ipa Payload
          ls -la Schieraxi.ipa
          # l'estensione del widget deve stare dentro l'app (PlugIns), con il suo eseguibile
          ls -la Payload/Schieraxi.app/PlugIns/SchieraxiWidget.appex
          test -f Payload/Schieraxi.app/PlugIns/SchieraxiWidget.appex/SchieraxiWidget
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" Payload/Schieraxi.app/PlugIns/SchieraxiWidget.appex/Info.plist
          /usr/libexec/PlistBuddy -c "Print :FantaHost" Payload/Schieraxi.app/Info.plist | sed 's/./*/g'   # solo per controllare che non sia vuoto
      - uses: actions/upload-artifact@v4
        with:
          name: Schieraxi-ipa
          path: Schieraxi.ipa
          retention-days: 30
      - name: Pubblica come release (da scaricare dall'iPhone)
        if: github.ref == 'refs/heads/main' && (inputs.runner || 'macos-15') == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Schieraxi.ipa --title "Build ${{ github.run_number }}" --notes "IPA non firmato, da installare con SideStore." --repo "$GITHUB_REPOSITORY"
      - name: Log in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilazione
          path: build.log
