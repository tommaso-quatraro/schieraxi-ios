name: Compila IPA

# Compila l'app su un Mac di GitHub SENZA firma (la firma la fa SideStore sull'iPhone con l'Apple ID gratuito).
# L'indirizzo del server NON è dentro l'app: si inserisce nell'app al primo avvio (e in Lega > Server). Il segreto FANTA_HOST resta solo per controllare che l'IPA non lo contenga.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Immagine del Mac (prova: macos-26 per Xcode 26 e Liquid Glass; la release si crea solo con quella predefinita, macos-26; macos-15 resta come ripiego)"
        type: choice
        options: [macos-26, macos-15]
        default: macos-26
  push:
    branches: [main]
    # solo se cambia qualcosa che finisce nell'IPA o nella sua compilazione (i documenti e i test non servono)
    paths:
      - "Sources/**"
      - "WidgetSources/**"
      - "Config/**"
      - "project.yml"
      - "scripts/genera_sorgente.py"
      - "scripts/maschera_log.py"
      - ".github/workflows/ipa.yml"

permissions:
  contents: write

# Una build alla volta; in coda resta solo l'ultima richiesta (le altre si annullano da sole).
# Su main la build in corso NON si annulla mai: può essere quella che crea la release (build-N).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ipa:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Numero della build (dopo la ricostruzione del repository riparte da 213)
        run: echo "BUILD_N=$((GITHUB_RUN_NUMBER + 212))" >> "$GITHUB_ENV"
      - name: Installa XcodeGen
        run: brew install xcodegen
      - name: Crea il progetto Xcode
        run: xcodegen generate
      - name: Compila (senza firma)
        run: |
          set -o pipefail
          xcodebuild -project Schieraxi.xcodeproj -scheme Schieraxi -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Schieraxi.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${{ env.BUILD_N }}" CURRENT_PROJECT_VERSION="${{ env.BUILD_N }}" \
            2>&1 | tee build.log | tail -n 40
      - name: Crea l'IPA
        env:
          FANTA_HOST: ${{ secrets.FANTA_HOST }}
        run: |
          mkdir -p Payload
          cp -R build/Schieraxi.xcarchive/Products/Applications/Schieraxi.app Payload/
          # App Group con l'Apple ID gratuito: i permessi (entitlements) vanno dentro i programmi dell'IPA non firmato, altrimenti
          # SideStore non sa che servono e non registra il gruppo. ldid li incorpora (SideStore poi firma da capo).
          brew install ldid > /dev/null 2>&1 || echo "ldid non installato: niente App Group nell'IPA"
          if command -v ldid > /dev/null; then
            ldid -SConfig/SchieraxiWidget.entitlements Payload/Schieraxi.app/PlugIns/SchieraxiWidget.appex/SchieraxiWidget || echo "ldid: widget non riuscito"
            ldid -SConfig/Schieraxi.entitlements Payload/Schieraxi.app/Schieraxi || echo "ldid: app non riuscito"
            ldid -e Payload/Schieraxi.app/Schieraxi | grep -A2 application-groups || echo "ATTENZIONE: permessi non trovati nell'app"
            ldid -e Payload/Schieraxi.app/PlugIns/SchieraxiWidget.appex/SchieraxiWidget | grep -A2 application-groups || echo "ATTENZIONE: permessi non trovati nel widget"
          fi
          zip -qry Schieraxi.ipa Payload
          ls -la Schieraxi.ipa
          # l'estensione del widget deve stare dentro l'app (PlugIns), con il suo eseguibile
          ls -la Payload/Schieraxi.app/PlugIns/SchieraxiWidget.appex
          test -f Payload/Schieraxi.app/PlugIns/SchieraxiWidget.appex/SchieraxiWidget
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" Payload/Schieraxi.app/PlugIns/SchieraxiWidget.appex/Info.plist
          # il repository è pubblico: l'indirizzo del server non deve stare nell'IPA (né come chiave dell'Info.plist né come testo)
          ! /usr/libexec/PlistBuddy -c "Print :FantaHost" Payload/Schieraxi.app/Info.plist 2>/dev/null
          ! /usr/libexec/PlistBuddy -c "Print :FantaHost" Payload/Schieraxi.app/PlugIns/SchieraxiWidget.appex/Info.plist 2>/dev/null
          if grep -rqiE '[a-z0-9-]+[.]ts[.]net' Payload; then echo "ERRORE: un indirizzo ts.net e' dentro l'IPA"; exit 1; fi
          if [ -n "$FANTA_HOST" ] && grep -rqF "$FANTA_HOST" Payload; then echo "ERRORE: l'indirizzo del server e' dentro l'IPA"; exit 1; fi
          # le icone alternative (Lega > Icona dell'app) devono essere dichiarate nell'Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons" Payload/Schieraxi.app/Info.plist | head -n 20
          # i target di test non devono finire nell'IPA
          ! ls Payload/Schieraxi.app/PlugIns | grep -i test
      - uses: actions/upload-artifact@v4
        with:
          name: Schieraxi-ipa
          path: Schieraxi.ipa
          retention-days: 30
      - name: Pubblica come release (da scaricare dall'iPhone)
        if: github.ref == 'refs/heads/main' && (inputs.runner || 'macos-26') == 'macos-26'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # il sorgente di SideStore: l'indirizzo fisso è .../releases/latest/download/sorgente.json
          python3 scripts/genera_sorgente.py "$GITHUB_REPOSITORY" "${{ env.BUILD_N }}" Schieraxi.ipa
          gh release create "build-${{ env.BUILD_N }}" Schieraxi.ipa sorgente.json --title "Build ${{ env.BUILD_N }}" --notes "IPA non firmato, da installare con SideStore. Aggiornamenti automatici: aggiungi in SideStore il sorgente https://github.com/$GITHUB_REPOSITORY/releases/latest/download/sorgente.json" --repo "$GITHUB_REPOSITORY"
      - name: Maschera il log (il repository è pubblico)
        if: failure()
        env:
          FANTA_HOST: ${{ secrets.FANTA_HOST }}
          FANTA_PORT: ${{ secrets.FANTA_PORT }}
        run: |
          python3 -I scripts/maschera_log.py build.log build-mascherato.log
          if [ -n "$FANTA_HOST" ] && grep -qF "$FANTA_HOST" build-mascherato.log; then echo "indirizzo ancora presente: non carico il log"; rm -f build-mascherato.log; fi
      - name: Log in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilazione
          path: build-mascherato.log
          if-no-files-found: ignore
