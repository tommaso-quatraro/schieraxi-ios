name: Schieraxi
options:
  bundleIdPrefix: it.tommaso
  deploymentTarget:
    # 18: Tab, zoom, MeshGradient, sidebarAdaptable. Le funzioni di iOS 26 (Liquid Glass) sono protette da #available con un ripiego.
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Schieraxi:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: SchieraxiWidget
    # App Group con l'Apple ID gratuito (SideStore/AltStore): dichiarato qui, incorporato nell'IPA con ldid (vedi ipa.yml);
    # SideStore lo registra e scrive il nome vero in Info.plist (ALTAppGroups). Vedi Sources/Support/Condiviso.swift.
    entitlements:
      path: Config/Schieraxi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.it.tommaso.schieraxi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.schieraxi
        PRODUCT_NAME: Schieraxi
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # icone alternative scelte in Lega > Icona dell'app (AppIcon-<colore> nell'asset catalog; il verde e' AppIcon)
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-blu AppIcon-viola AppIcon-arancio AppIcon-rosso AppIcon-grafite"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: SchieraXI
        CFBundleLocalizations:
          - it
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # schermata di avvio senza storyboard: verde campo con il marchio fermo (4-3-3 e capitano)
        UILaunchScreen:
          UIColorName: FondoLancio
          UIImageName: MarchioLancio
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # schema schieraxi:// (per aprire l'app da una notifica ntfy con l'intestazione Click)
        CFBundleURLTypes:
          - CFBundleURLName: it.tommaso.schieraxi
            CFBundleURLSchemes:
              - schieraxi
        # aggiornamento in background (BGAppRefreshTask): identificativo permesso e modalità "fetch"
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - it.tommaso.schieraxi.aggiorna
        # «Apri con SchieraXI» per i file delle rose (Excel, CSV, testo) da Files, Mail e dal menu Condividi: l'app ne riceve una copia
        CFBundleDocumentTypes:
          - CFBundleTypeName: File delle rose
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.spreadsheetml.sheet
              - public.comma-separated-values-text
              - public.tab-separated-values-text
              - public.plain-text
          # «Apri con SchieraXI» per le immagini (stemma e divisa dalla libreria, da Files o dal menu Condividi)
          - CFBundleTypeName: Immagine di una squadra
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.png
              - public.jpeg
              - public.heic
              - org.webmproject.webp
        LSSupportsOpeningDocumentsInPlace: false
  SchieraxiWidget:
    # estensione widget (WidgetKit): conto alla rovescia, modulo e punti attesi. Consuma un App ID in più con l'Apple ID gratuito.
    type: app-extension
    platform: iOS
    entitlements:
      path: Config/SchieraxiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.it.tommaso.schieraxi
    sources:
      - path: WidgetSources
      - path: Sources/Domain/Modelli.swift
      - path: Sources/Domain/Quando.swift
      - path: Sources/Domain/Formato.swift
      - path: Sources/Support/Condiviso.swift
      - path: Sources/Support/WidgetRiassunto.swift
      - path: Sources/Domain/ColoriSquadra.swift
      - path: Sources/Domain/GeneratoreVolto.swift
      - path: Sources/Support/AvatarVolto.swift
      - path: Sources/Support/Design/PercorsoSVG.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.schieraxi.widget
        PRODUCT_NAME: SchieraxiWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/WidgetInfo.plist
      properties:
        CFBundleDisplayName: SchieraXI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AnteprimaWidget:
    # app SOLO per la CI (screenshot.yml): mostra i widget nelle loro misure con dati finti, per fotografarli sul simulatore di iPhone e iPad.
    # Non e' una dipendenza di SchieraXI, quindi non entra nell'IPA. Compila gli stessi file dell'estensione (tranne il pacchetto @main).
    type: application
    platform: iOS
    sources:
      - path: AnteprimaWidget
      - path: WidgetSources
        excludes:
          - PacchettoWidget.swift
      - path: Sources/Domain/Modelli.swift
      - path: Sources/Domain/Quando.swift
      - path: Sources/Domain/Formato.swift
      - path: Sources/Support/Condiviso.swift
      - path: Sources/Support/WidgetRiassunto.swift
      - path: Sources/Domain/ColoriSquadra.swift
      - path: Sources/Domain/GeneratoreVolto.swift
      - path: Sources/Support/AvatarVolto.swift
      - path: Sources/Support/Design/PercorsoSVG.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.schieraxi.anteprima
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Anteprima widget
        TARGETED_DEVICE_FAMILY: "1,2"
  SchieraxiTests:
    # test automatici (XCTest) di Domain, Data e ViewModel: girano nel simulatore (workflow test.yml). Non entrano nell'IPA.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SchieraxiTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Schieraxi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.schieraxi.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  SchieraxiUITests:
    # test di fumo dell'interfaccia (XCUITest) con l'app in modalità -DEMO
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SchieraxiUITests
    dependencies:
      - target: Schieraxi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.schieraxi.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  AnteprimaWidget:
    build:
      targets:
        AnteprimaWidget: all
    run:
      config: Debug
  Schieraxi:
    # i test si costruiscono ed eseguono solo con "test": archive e build normali (ipa.yml, screenshot.yml) non li toccano
    build:
      targets:
        Schieraxi: all
        SchieraxiTests: [test]
        SchieraxiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SchieraxiTests
        - SchieraxiUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
