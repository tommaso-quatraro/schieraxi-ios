name: Schieraxi
options:
  bundleIdPrefix: it.tommaso
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # indirizzo dell'app: arriva dalle variabili di GitHub Actions (FANTA_HOST, FANTA_PORT), non sta nel codice
    FANTA_HOST: "example.invalid"
    FANTA_PORT: "443"
targets:
  Schieraxi:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: SchieraxiWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.schieraxi
        PRODUCT_NAME: Schieraxi
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: SchieraXI
        CFBundleLocalizations:
          - it
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # schema schieraxi:// (per aprire l'app da una notifica ntfy con l'intestazione Click)
        CFBundleURLTypes:
          - CFBundleURLName: it.tommaso.schieraxi
            CFBundleURLSchemes:
              - schieraxi
        # aggiornamento in background (BGAppRefreshTask): identificativo permesso e modalità "fetch"
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - it.tommaso.schieraxi.aggiorna
        FantaHost: $(FANTA_HOST)
        FantaPort: $(FANTA_PORT)
  SchieraxiWidget:
    # estensione widget (WidgetKit): conto alla rovescia, modulo e punti attesi. Consuma un App ID in più con l'Apple ID gratuito.
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetSources
      - path: Sources/Domain/Modelli.swift
      - path: Sources/Domain/Quando.swift
      - path: Sources/Domain/Formato.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.schieraxi.widget
        PRODUCT_NAME: SchieraxiWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/WidgetInfo.plist
      properties:
        CFBundleDisplayName: SchieraXI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        FantaHost: $(FANTA_HOST)
        FantaPort: $(FANTA_PORT)
  SchieraxiTests:
    # test automatici (XCTest) di Domain, Data e ViewModel: girano nel simulatore (workflow test.yml). Non entrano nell'IPA.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SchieraxiTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Schieraxi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.schieraxi.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  SchieraxiUITests:
    # test di fumo dell'interfaccia (XCUITest) con l'app in modalità -DEMO
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SchieraxiUITests
    dependencies:
      - target: Schieraxi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.schieraxi.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Schieraxi:
    # i test si costruiscono ed eseguono solo con "test": archive e build normali (ipa.yml, screenshot.yml) non li toccano
    build:
      targets:
        Schieraxi: all
        SchieraxiTests: [test]
        SchieraxiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SchieraxiTests
        - SchieraxiUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
